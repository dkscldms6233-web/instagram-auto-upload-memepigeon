name: 인스타 토큰 연장

on:
  schedule:
    - cron: "0 0 1,15 * *"   # 매달 1일·15일 (한국시간 오전 9시)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 토큰 확인
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python post.py check

      - name: 토큰 연장
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python post.py refresh
