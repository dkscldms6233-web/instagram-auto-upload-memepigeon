name: 인스타 토큰 확인

on:
  schedule:
    - cron: "0 0 1,15 * *"   # 매달 1일·15일 (한국시간 오전 9시)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 토큰 확인 (만료되면 실패 + 메일 알림)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python post.py refresh
